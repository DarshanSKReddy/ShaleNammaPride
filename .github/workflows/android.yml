name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Create dummy google-services.json for CI
      run: |
        echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project-id"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef123456","android_client_info":{"package_name":"com.example.shale_nammapride"}},"api_key":[{"current_key":"dummy-key"}]}]}' > app/google-services.json

    - name: Build with Gradle
      run: ./gradlew build --stacktrace
